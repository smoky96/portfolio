services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      APP_ENV: prod
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ALLOW_SELF_REGISTRATION: ${VITE_ALLOW_SELF_REGISTRATION:-false}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    networks:
      - app_net

  backup:
    build:
      context: ./infrastructure/backup
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      BACKUP_DIR: /backups
    volumes:
      - backups:/backups
    networks:
      - app_net

networks:
  app_net:

volumes:
  backups:
